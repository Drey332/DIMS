# .github/workflows/codex-pr.yml
name: Codex Codegen PR

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  codex_codegen_pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1) Create & PUSH a working branch so the remote can see it
      - name: Create working branch
        run: |
          BR="codex/update-$(date +%Y%m%d-%H%M%S)"
          echo "BRANCH_NAME=$BR" >> "$GITHUB_ENV"
          git switch -c "$BR"
          # Push immediately so later steps that refer to it won't fail
          git push --set-upstream origin "$BR"

      # 2) Run the Codex action (use only supported inputs)
      #    The action's warning listed valid keys: branch_name, prompt,
      #    approval_mode, github_token, model, provider_api_key, provider, provider_base_url
      - name: Run OpenAI Codex (generator)
        uses: lemonberrylabs/openai-codex-action@v0.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch_name: ${{ env.BRANCH_NAME }}
          # free to change this prompt; keep it specific to your repo
          prompt: |
            Review the TypeScript/React and Node code in client/ and server/.
            Propose small, safe improvements: better error handling and doc comments.
            Keep builds passing and do not leak secrets.

      # 3) See if anything actually changed
      - name: Detect changes
        id: changes
        run: |
          if git status --porcelain | grep .; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      # 4) Commit any generated changes
      - name: Commit changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name  "codex-bot"
          git config user.email "codex-bot@users.noreply.github.com"
          git add -A
          git commit -m "codex: automated suggestions"

      # 5) Push the branch with changes
      - name: Push branch
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git push

      # 6) Open a PR
      - name: Open Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.BRANCH_NAME }}
          base: main
          title: "Codex: automated suggestions"
          body: |
            This PR was opened automatically by Codex.
            Please review the generated changes before merging.
          labels: codex, automated
