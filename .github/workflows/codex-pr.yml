# .github/workflows/codex-pr.yml
name: Codex Codegen PR

on:
  workflow_dispatch:   # run manually from the Actions tab

permissions:
  contents: write        # allow pushing commits
  pull-requests: write   # allow opening PRs

jobs:
  codex_codegen_pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so new branch points to current HEAD

      - name: Create & publish working branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          BR="codex/update-$(date +%Y%m%d-%H%M%S)"
          echo "BRANCH_NAME=$BR" >> "$GITHUB_ENV"

          # create branch from current HEAD
          git switch -c "$BR"

          # publish it to origin *now* so the next action can find it
          git push --set-upstream origin "$BR"

      # --- Run Codex (generator) on that branch ---
      - name: Run OpenAI Codex (generator)
        uses: lemonberrylabs/openai-codex-action@v0.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}     # required by the action
          provider: openai
          provider_api_key: ${{ secrets.OPENAI_API_KEY }}  # you added this in Settings → Secrets
          model: gpt-4o-mini
          branch_name: ${{ env.BRANCH_NAME }}           # the branch we just pushed
          approval_mode: auto
          prompt: |
            Review the TypeScript/React and Node code in client/ and server/.
            Make small, safe improvements (readability, error handling, doc comments).
            Keep builds passing and do not expose secrets.
          # Optional: restrict scope if you like
          # paths: |
          #   client/**
          #   server/**

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if git status --porcelain | grep .; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          git config user.name  "codex-bot"
          git config user.email "codex-bot@users.noreply.github.com"
          git add -A
          git commit -m "codex: automated suggestions"

      - name: Push branch
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          git push

      - name: Open Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Codex: automated suggestions"
          body: |
            This PR was opened automatically by Codex.
            Please review the generated changes before merging.
          branch: ${{ env.BRANCH_NAME }}
          base: main
          labels: codex, automated
